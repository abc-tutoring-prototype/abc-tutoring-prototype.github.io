<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Tutoring</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>ABC Tutoring</h1>
      <p class="tagline">Friendly, reliable tutors for every subject and grade.</p>
    </div>
  </header>

  <main class="wrap">
    <section id="home">
      <h2>Find your tutor</h2>
      <p>Browse our tutors below, then pick an open time that works for you.</p>
    </section>

    <section id="tutors">
      <div id="tutor-grid" class="tutor-grid"></div>
    </section>
  </main>

  <div id="booking-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <h3 id="modal-tutor-name"></h3>
      <p id="modal-tutor-subjects" class="muted"></p>

      <div id="modal-slots-view">
        <h4>Choose a time</h4>
        <div id="slot-list" class="slot-list"></div>
      </div>

      <form id="booking-form" class="hidden">
        <h4>Your details</h4>
        <p id="chosen-slot-label" class="muted"></p>
        <label>Parent name<input type="text" id="parent-name" required></label>
        <label>Parent email<input type="email" id="parent-email" required></label>
        <label>Student first name<input type="text" id="student-name" required></label>
        <label>Student grade<input type="text" id="student-grade" required></label>
        <label>Subject
          <select id="booking-subject" required></select>
        </label>
        <button type="submit" class="btn-primary">Confirm booking</button>
      </form>

      <div id="modal-confirmation" class="hidden">
        <p class="confirm-msg">✅ Booking confirmed! A confirmation has been sent to your email.</p>
        <button id="modal-done" class="btn-primary">Done</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 ABC Tutoring</p>
    </div>
  </footer>
